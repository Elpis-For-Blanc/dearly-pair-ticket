<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEARLY — 우리의 작은 방</title><link rel="stylesheet" href="style.css"></head><body>
<header><small>DEARLY SERIES 02</small><h1>DEARLY <span>— 우리의 작은 방</span></h1><p>소중한 둘이 머물 작은 공간을 꾸며요.</p></header>
<main><aside>
<h3>01 · ROOM INFO</h3><div class="two"><label>첫 번째 이름<input id="a"></label><label>두 번째 이름<input id="b"></label></div><label>페어명<input id="pair"></label>
<h3>02 · ROOM STYLE</h3><div class="two"><label>벽 색<input id="wall" type="color" value="#fff1f5"></label><label>바닥 색<input id="floor" type="color" value="#e8cdbf"></label></div><label>분위기<select id="mood"><option>포근한 낮</option><option>분홍 노을</option><option>별빛 밤</option></select></label>
<h3>03 · ITEM BOX</h3><div id="tabs"></div><div id="items"></div>
<h3>04 · SELECTED ITEM</h3><div class="buttons"><button id="small">− 작게</button><button id="big">＋ 크게</button><button id="flip">↔ 반전</button></div><div class="buttons"><button id="back">↓ 뒤로</button><button id="front">↑ 앞으로</button><button id="del">삭제</button></div>
<h3>05 · OUR TRACE</h3><label class="upload">사진을 액자로 넣기<input id="photo" type="file" accept="image/*"></label><label>메모 문구<input id="memo" maxlength="24" placeholder="A ♡ B"></label><button id="addMemo">메모 붙이기</button>
<h3>06 · SAVE</h3><label><input id="sign" type="checkbox" checked> DEARLY 서명 표시</label><div class="buttons"><button id="reset">방 비우기</button><button class="pink" id="save">PNG 저장</button></div><p class="hint">소품을 누르면 방에 추가돼요. 드래그/터치로 이동할 수 있어요.</p>
</aside>
<section class="work"><div id="capture"><div id="room"><div id="wallBg"></div><div class="base"></div><div id="floorBg"></div><div id="stage"></div></div><footer id="footer"><b>DEARLY — 우리의 작은 방</b><span id="label">OUR LITTLE ROOM</span></footer></div><button id="none">선택 해제</button></section>
</main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="script.js"></script></body></html>
